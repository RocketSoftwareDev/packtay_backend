spring.application.name=paktay-auth-svc
server.port=${SERVER_PORT:8081}
server.forward-headers-strategy=framework
paktay.cors.allowed-origin-patterns=${PAKTAY_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}

spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/paktay}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/paktay/protocol/openid-connect/certs}

paktay.keycloak.internal-url=${KEYCLOAK_INTERNAL_URL:http://localhost:8180}
paktay.keycloak.public-url=${KEYCLOAK_PUBLIC_URL:http://localhost:8180}
paktay.keycloak.realm=${KEYCLOAK_REALM:paktay}
paktay.keycloak.mobile-client-id=${KEYCLOAK_MOBILE_CLIENT_ID:paktay-mobile}
paktay.keycloak.service-client-id=${KEYCLOAK_SERVICE_CLIENT_ID:paktay-auth-service}
paktay.keycloak.service-client-secret=${KEYCLOAK_SERVICE_CLIENT_SECRET}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
logging.level.ec.paktay=INFO

# SMTP: credenciales exclusivamente desde el entorno local.
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:465}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASS:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=${SMTP_SECURE:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.datasource.url=${BUSINESS_DB_URL:jdbc:postgresql://localhost:5433/paktay}
spring.datasource.username=${BUSINESS_DB_USERNAME:paktay}
spring.datasource.password=${BUSINESS_DB_PASSWORD}
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:password-schema.sql
