# Avisos push por Firebase (PushSender). Vacío o archivo vacío = apagados.
paktay.push.credentials-file=${FIREBASE_CREDENTIALS_FILE:}
spring.application.name=paktay-business-svc
server.port=${SERVER_PORT:8082}
server.forward-headers-strategy=framework
paktay.cors.allowed-origin-patterns=${PAKTAY_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}
# Dominios de la web del formulario público de soporte; vacío = los mismos del panel.
paktay.cors.public-origin-patterns=${PAKTAY_CORS_PUBLIC_ORIGIN_PATTERNS:}
# Cabecera X-Paktay-Client obligatoria en /api/v1/admin/** (AdminClientHeaderFilter).
paktay.admin.require-client-header=${PAKTAY_ADMIN_REQUIRE_CLIENT_HEADER:true}
paktay.admin.client-header-value=${PAKTAY_ADMIN_CLIENT_HEADER_VALUE:admin-web}
# /api/v1/admin/** solo acepta tokens del login propio del panel (azp).
paktay.admin.require-panel-token=${PAKTAY_ADMIN_REQUIRE_PANEL_TOKEN:true}
paktay.admin.panel-client-id=${KEYCLOAK_ADMIN_PANEL_CLIENT_ID:paktay-admin-panel}
spring.datasource.url=${BUSINESS_DB_URL:jdbc:postgresql://localhost:5433/paktay}
spring.datasource.username=${BUSINESS_DB_USERNAME:paktay}
spring.datasource.password=${BUSINESS_DB_PASSWORD}
# Flyway es el único dueño del esquema desde el 2026-09-23 (V1 = esquema real de ese día).
# En una base que ya existía sin historial, V1 se marca como baseline y se aplica desde V2.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/paktay}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/paktay/protocol/openid-connect/certs}
paktay.keycloak.health-url=${KEYCLOAK_HEALTH_URL:${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/paktay}}
paktay.supabase.url=${SUPABASE_URL:}
paktay.supabase.secret-key=${SUPABASE_SECRET_KEY:}
paktay.supabase.avatar-bucket=${SUPABASE_AVATAR_BUCKET:avatars}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
# Correo de soporte (SupportMailService). El correo no decide la salud del servicio.
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:465}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASS:}
paktay.mail.from=${SMTP_FROM:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=${SMTP_SECURE:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
management.health.mail.enabled=false
# Estado del sistema del panel: health de auth-svc (en Docker, por el nombre del servicio).
paktay.admin.auth-health-url=${AUTH_HEALTH_URL:http://localhost:8081/actuator/health}
paktay.support.verify-link=${SUPPORT_VERIFY_LINK:http://localhost:8082/api/v1/public/support/verify?token={token}}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
logging.level.ec.paktay=INFO
# Muestra sentencias JDBC sin imprimir parámetros, tokens, contraseñas ni payloads de bancos.
logging.level.org.springframework.jdbc.core.JdbcTemplate=DEBUG
logging.level.org.springframework.jdbc.core.namedparam.NamedParameterJdbcTemplate=DEBUG
