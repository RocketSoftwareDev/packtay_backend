# Entorno aislado de desarrollo. Se usa junto con docker-compose.yml y un nombre
# de proyecto distinto para obtener redes, contenedores y volúmenes independientes.
# No incluye el perfil `tunnel`, por lo que nunca inicia cloudflared.
services:
  business-db:
    mem_limit: 384m
    mem_reservation: 96m
    ports: !override
      - "127.0.0.1:25433:5432"

  keycloak-init:
    mem_limit: 128m
    mem_reservation: 64m
    environment:
      KEYCLOAK_INTERNAL_URL: http://host.docker.internal:28180

  auth-svc:
    mem_limit: 640m
    mem_reservation: 160m
    environment:
      KEYCLOAK_INTERNAL_URL: http://host.docker.internal:28180
      KEYCLOAK_JWK_SET_URI: http://host.docker.internal:28180/realms/paktay/protocol/openid-connect/certs
      KEYCLOAK_PUBLIC_URL: http://${PAKTAY_LOCAL_HOST:-localhost}:28180
      KEYCLOAK_ISSUER_URI: http://${PAKTAY_LOCAL_HOST:-localhost}:28180/realms/paktay
    ports: !override
      - "0.0.0.0:28081:8081"

  business-svc:
    mem_limit: 768m
    mem_reservation: 192m
    environment:
      KEYCLOAK_JWK_SET_URI: http://host.docker.internal:28180/realms/paktay/protocol/openid-connect/certs
      KEYCLOAK_HEALTH_URL: http://host.docker.internal:28180/realms/paktay
      KEYCLOAK_ISSUER_URI: http://${PAKTAY_LOCAL_HOST:-localhost}:28180/realms/paktay
    ports: !override
      - "0.0.0.0:28082:8082"
