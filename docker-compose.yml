services:
  business-db:
    image: postgres:16-alpine
    mem_limit: 384m
    mem_reservation: 96m
    restart: unless-stopped
    environment:
      POSTGRES_DB: paktay
      POSTGRES_USER: paktay
      POSTGRES_PASSWORD: ${BUSINESS_DB_PASSWORD:?BUSINESS_DB_PASSWORD es obligatorio}
    ports:
      - "127.0.0.1:${BUSINESS_DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paktay -d paktay"]
      interval: 5s
      timeout: 5s
      retries: 15
    volumes:
      - business-data:/var/lib/postgresql/data

  keycloak-init:
    profiles: ["identity-setup"]
    image: quay.io/keycloak/keycloak:26.2
    mem_limit: 128m
    mem_reservation: 64m
    entrypoint:
      - /bin/sh
      - -ec
      - >-
        attempts=0;
        until /opt/keycloak/bin/kcadm.sh config credentials --server "$$KEYCLOAK_INTERNAL_URL" --realm master --user "$$KC_BOOTSTRAP_ADMIN_USERNAME" --password "$$KC_BOOTSTRAP_ADMIN_PASSWORD"; do attempts=$$((attempts + 1)); test "$$attempts" -lt 20; sleep 3; done;
        CLIENT_UUID=$$(/opt/keycloak/bin/kcadm.sh get clients -r paktay -q clientId=paktay-auth-service --fields id --format csv --noquotes);
        test -n "$$CLIENT_UUID";
        /opt/keycloak/bin/kcadm.sh update realms/paktay -s "accessTokenLifespan=$$KEYCLOAK_ACCESS_TOKEN_LIFESPAN" -s "ssoSessionIdleTimeout=$$KEYCLOAK_SSO_SESSION_IDLE_TIMEOUT" -s "ssoSessionMaxLifespan=$$KEYCLOAK_SSO_SESSION_MAX_LIFESPAN";
        /opt/keycloak/bin/kcadm.sh update "clients/$$CLIENT_UUID" -r paktay -s "secret=$$KEYCLOAK_SERVICE_CLIENT_SECRET";
        /opt/keycloak/bin/kcadm.sh set-password -r paktay --username "$$PAKTAY_ADMIN_EMAIL" --new-password "$$PAKTAY_ADMIN_PASSWORD";
        /opt/keycloak/bin/kcadm.sh add-roles -r paktay --uusername service-account-paktay-auth-service --cclientid realm-management --rolename manage-users --rolename view-users --rolename query-users --rolename view-realm
    environment:
      KEYCLOAK_INTERNAL_URL: ${SHARED_KEYCLOAK_INTERNAL_URL:-http://host.docker.internal:8180}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD es obligatorio}
      KEYCLOAK_SERVICE_CLIENT_SECRET: ${KEYCLOAK_SERVICE_CLIENT_SECRET:?Define KEYCLOAK_SERVICE_CLIENT_SECRET in .env}
      PAKTAY_CORS_ALLOWED_ORIGIN_PATTERNS: ${PAKTAY_CORS_ALLOWED_ORIGIN_PATTERNS:-http://localhost:*,http://127.0.0.1:*}
      KEYCLOAK_ACCESS_TOKEN_LIFESPAN: ${KEYCLOAK_ACCESS_TOKEN_LIFESPAN:-28800}
      KEYCLOAK_SSO_SESSION_IDLE_TIMEOUT: ${KEYCLOAK_SSO_SESSION_IDLE_TIMEOUT:-2592000}
      KEYCLOAK_SSO_SESSION_MAX_LIFESPAN: ${KEYCLOAK_SSO_SESSION_MAX_LIFESPAN:-2592000}
      PAKTAY_ADMIN_EMAIL: ${PAKTAY_ADMIN_EMAIL:?Define PAKTAY_ADMIN_EMAIL in .env}
      PAKTAY_ADMIN_PASSWORD: ${PAKTAY_ADMIN_PASSWORD:?Define PAKTAY_ADMIN_PASSWORD in .env}

  auth-svc:
    mem_limit: 640m
    mem_reservation: 160m
    restart: unless-stopped
    build:
      context: .
      dockerfile: auth-svc/Dockerfile
    environment:
      SMTP_HOST: ${SMTP_HOST:?Define SMTP_HOST in .env}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      SMTP_USER: ${SMTP_USER:?Define SMTP_USER in .env}
      SMTP_PASS: ${SMTP_PASS:?Define SMTP_PASS in .env}
      SMTP_FROM: ${SMTP_FROM:-}
      BUSINESS_DB_URL: jdbc:postgresql://business-db:5432/paktay
      BUSINESS_DB_USERNAME: paktay
      BUSINESS_DB_PASSWORD: ${BUSINESS_DB_PASSWORD:?BUSINESS_DB_PASSWORD es obligatorio}
      KEYCLOAK_INTERNAL_URL: ${SHARED_KEYCLOAK_INTERNAL_URL:-http://host.docker.internal:8180}
      KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8180}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:-http://localhost:8180/realms/paktay}
      KEYCLOAK_JWK_SET_URI: ${SHARED_KEYCLOAK_INTERNAL_URL:-http://host.docker.internal:8180}/realms/paktay/protocol/openid-connect/certs
      KEYCLOAK_SERVICE_CLIENT_SECRET: ${KEYCLOAK_SERVICE_CLIENT_SECRET:?Define KEYCLOAK_SERVICE_CLIENT_SECRET in .env}
      PAKTAY_CORS_ALLOWED_ORIGIN_PATTERNS: ${PAKTAY_CORS_ALLOWED_ORIGIN_PATTERNS:-http://localhost:*,http://127.0.0.1:*}
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${AUTH_PORT:-8081}:8081"
    depends_on:
      business-db:
        condition: service_healthy

  business-svc:
    mem_limit: 768m
    mem_reservation: 192m
    restart: unless-stopped
    build:
      context: .
      dockerfile: business-svc/Dockerfile
    environment:
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:-http://localhost:8180/realms/paktay}
      KEYCLOAK_JWK_SET_URI: ${SHARED_KEYCLOAK_INTERNAL_URL:-http://host.docker.internal:8180}/realms/paktay/protocol/openid-connect/certs
      KEYCLOAK_HEALTH_URL: ${SHARED_KEYCLOAK_INTERNAL_URL:-http://host.docker.internal:8180}/realms/paktay
      BUSINESS_DB_URL: jdbc:postgresql://business-db:5432/paktay
      BUSINESS_DB_USERNAME: paktay
      BUSINESS_DB_PASSWORD: ${BUSINESS_DB_PASSWORD:?BUSINESS_DB_PASSWORD es obligatorio}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-}
      SUPABASE_AVATAR_BUCKET: ${SUPABASE_AVATAR_BUCKET:-avatars}
      PAKTAY_CORS_ALLOWED_ORIGIN_PATTERNS: ${PAKTAY_CORS_ALLOWED_ORIGIN_PATTERNS:-http://localhost:*,http://127.0.0.1:*}
      # Avisos push opcionales. Sin credenciales, no se envía nada.
      FIREBASE_CREDENTIALS_FILE: /run/secrets/firebase-admin.json
    volumes:
      # FIREBASE_CREDENTIALS_HOST_FILE = ruta en la máquina al .json de la cuenta de
      # servicio. Sin definir se monta /dev/null (archivo vacío = avisos apagados).
      - ${FIREBASE_CREDENTIALS_HOST_FILE:-/dev/null}:/run/secrets/firebase-admin.json:ro
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${BUSINESS_PORT:-8082}:8082"
    depends_on:
      business-db:
        condition: service_healthy

  cloudflared:
    image: cloudflare/cloudflared:latest
    mem_limit: 128m
    mem_reservation: 64m
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}
    restart: unless-stopped
    depends_on:
      auth-svc:
        condition: service_started
      business-svc:
        condition: service_started

volumes:
  business-data:
    name: ${BUSINESS_DATA_VOLUME:-${COMPOSE_PROJECT_NAME:-packtay_backend}_business-data}
