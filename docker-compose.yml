services:
  keycloak-db:
    image: postgres:16-alpine
    mem_limit: 768m
    mem_reservation: 256m
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-ChangeThisDatabasePassword123!}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 15
    volumes:
      - keycloak-data:/var/lib/postgresql/data

  business-db:
    image: postgres:16-alpine
    mem_limit: 1g
    mem_reservation: 256m
    restart: unless-stopped
    environment:
      POSTGRES_DB: paktay
      POSTGRES_USER: paktay
      POSTGRES_PASSWORD: ${BUSINESS_DB_PASSWORD:-ChangeThisBusinessDatabasePassword123!}
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paktay -d paktay"]
      interval: 5s
      timeout: 5s
      retries: 15
    volumes:
      - business-data:/var/lib/postgresql/data
      - ./database/paktay_mvp_v0_1_postgres.sql:/docker-entrypoint-initdb.d/001-paktay-schema.sql:ro
      - ./database/paktay_mvp_v0_11_bank_card_offerings.sql:/docker-entrypoint-initdb.d/011-bank-card-offerings.sql:ro
      - ./database/paktay_mvp_v0_12_system_category_hierarchy.sql:/docker-entrypoint-initdb.d/012-system-category-hierarchy.sql:ro
      - ./database/paktay_mvp_v0_13_explicit_user_categories.sql:/docker-entrypoint-initdb.d/013-explicit-user-categories.sql:ro
      - ./database/paktay_mvp_v0_14_card_alias_optional_last4.sql:/docker-entrypoint-initdb.d/014-card-alias-optional-last4.sql:ro

  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    mem_limit: 2g
    mem_reservation: 512m
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-ChangeThisAdminPassword123!}
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-db
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-ChangeThisDatabasePassword123!}
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8180}
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      JAVA_OPTS_KC_HEAP: -Xms256m -Xmx1280m
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:8180:8080"
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000; echo -e 'GET /health/ready HTTP/1.1\\r\\nhost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep '200 OK' <&3"]
      interval: 10s
      timeout: 5s
      retries: 20

  keycloak-init:
    image: quay.io/keycloak/keycloak:26.2
    mem_limit: 512m
    mem_reservation: 128m
    entrypoint:
      - /bin/sh
      - -c
      - >-
        until /opt/keycloak/bin/kcadm.sh config credentials --server http://keycloak:8080 --realm master --user "$$KC_BOOTSTRAP_ADMIN_USERNAME" --password "$$KC_BOOTSTRAP_ADMIN_PASSWORD"; do sleep 3; done;
        CLIENT_UUID=$$(/opt/keycloak/bin/kcadm.sh get clients -r paktay -q clientId=paktay-auth-service --fields id --format csv --noquotes);
        test -n "$$CLIENT_UUID";
        /opt/keycloak/bin/kcadm.sh update realms/paktay -s "accessTokenLifespan=$$KEYCLOAK_ACCESS_TOKEN_LIFESPAN" -s "ssoSessionIdleTimeout=$$KEYCLOAK_SSO_SESSION_IDLE_TIMEOUT" -s "ssoSessionMaxLifespan=$$KEYCLOAK_SSO_SESSION_MAX_LIFESPAN";
        /opt/keycloak/bin/kcadm.sh update "clients/$$CLIENT_UUID" -r paktay -s "secret=$$KEYCLOAK_SERVICE_CLIENT_SECRET";
        /opt/keycloak/bin/kcadm.sh set-password -r paktay --username "$$PAKTAY_ADMIN_EMAIL" --new-password "$$PAKTAY_ADMIN_PASSWORD";
        /opt/keycloak/bin/kcadm.sh add-roles -r paktay --uusername service-account-paktay-auth-service --cclientid realm-management --rolename manage-users --rolename view-users --rolename query-users --rolename view-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-ChangeThisAdminPassword123!}
      KEYCLOAK_SERVICE_CLIENT_SECRET: ${KEYCLOAK_SERVICE_CLIENT_SECRET:?Define KEYCLOAK_SERVICE_CLIENT_SECRET in .env}
      PAKTAY_CORS_ALLOWED_ORIGIN_PATTERNS: ${PAKTAY_CORS_ALLOWED_ORIGIN_PATTERNS:-http://localhost:*,http://127.0.0.1:*}
      KEYCLOAK_ACCESS_TOKEN_LIFESPAN: ${KEYCLOAK_ACCESS_TOKEN_LIFESPAN:-28800}
      KEYCLOAK_SSO_SESSION_IDLE_TIMEOUT: ${KEYCLOAK_SSO_SESSION_IDLE_TIMEOUT:-2592000}
      KEYCLOAK_SSO_SESSION_MAX_LIFESPAN: ${KEYCLOAK_SSO_SESSION_MAX_LIFESPAN:-2592000}
      PAKTAY_ADMIN_EMAIL: ${PAKTAY_ADMIN_EMAIL:?Define PAKTAY_ADMIN_EMAIL in .env}
      PAKTAY_ADMIN_PASSWORD: ${PAKTAY_ADMIN_PASSWORD:?Define PAKTAY_ADMIN_PASSWORD in .env}
    depends_on:
      keycloak:
        condition: service_healthy

  auth-svc:
    mem_limit: 1280m
    mem_reservation: 256m
    restart: unless-stopped
    build:
      context: .
      dockerfile: auth-svc/Dockerfile
    environment:
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8180}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:-http://localhost:8180/realms/paktay}
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/paktay/protocol/openid-connect/certs
      KEYCLOAK_SERVICE_CLIENT_SECRET: ${KEYCLOAK_SERVICE_CLIENT_SECRET:?Define KEYCLOAK_SERVICE_CLIENT_SECRET in .env}
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      keycloak-init:
        condition: service_completed_successfully

  business-svc:
    mem_limit: 1536m
    mem_reservation: 384m
    restart: unless-stopped
    build:
      context: .
      dockerfile: business-svc/Dockerfile
    environment:
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:-http://localhost:8180/realms/paktay}
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/paktay/protocol/openid-connect/certs
      KEYCLOAK_HEALTH_URL: http://keycloak:8080/realms/paktay
      BUSINESS_DB_URL: jdbc:postgresql://business-db:5432/paktay
      BUSINESS_DB_USERNAME: paktay
      BUSINESS_DB_PASSWORD: ${BUSINESS_DB_PASSWORD:-ChangeThisBusinessDatabasePassword123!}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-}
      SUPABASE_AVATAR_BUCKET: ${SUPABASE_AVATAR_BUCKET:-avatars}
      FLYWAY_ENABLED: "false"
      PAKTAY_CORS_ALLOWED_ORIGIN_PATTERNS: ${PAKTAY_CORS_ALLOWED_ORIGIN_PATTERNS:-http://localhost:*,http://127.0.0.1:*}
    ports:
      - "127.0.0.1:8082:8082"
    depends_on:
      keycloak-init:
        condition: service_completed_successfully
      business-db:
        condition: service_healthy

  cloudflared:
    image: cloudflare/cloudflared:latest
    mem_limit: 256m
    mem_reservation: 64m
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}
    restart: unless-stopped
    depends_on:
      keycloak:
        condition: service_healthy
      auth-svc:
        condition: service_started
      business-svc:
        condition: service_started

volumes:
  keycloak-data:
  business-data:
