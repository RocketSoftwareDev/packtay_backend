services:
  business-db:
    image: postgres:16-alpine
    mem_limit: 384m
    mem_reservation: 96m
    restart: unless-stopped
    environment:
      POSTGRES_DB: paktay
      POSTGRES_USER: paktay
      POSTGRES_PASSWORD: ${BUSINESS_DB_PASSWORD:?BUSINESS_DB_PASSWORD es obligatorio}
    ports:
      - "127.0.0.1:${BUSINESS_DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paktay -d paktay"]
      interval: 5s
      timeout: 5s
      retries: 15
    volumes:
      - business-data:/var/lib/postgresql/data

  keycloak-init:
    profiles: ["identity-setup"]
    image: quay.io/keycloak/keycloak:26.2
    mem_limit: 128m
    mem_reservation: 64m
    entrypoint:
      - /bin/sh
      - -ec
      - >-
        attempts=0;
        until /opt/keycloak/bin/kcadm.sh config credentials --server "$$KEYCLOAK_INTERNAL_URL" --realm master --user "$$KC_BOOTSTRAP_ADMIN_USERNAME" --password "$$KC_BOOTSTRAP_ADMIN_PASSWORD"; do attempts=$$((attempts + 1)); test "$$attempts" -lt 20; sleep 3; done;
        CLIENT_UUID=$$(/opt/keycloak/bin/kcadm.sh get clients -r paktay -q clientId=paktay-auth-service --fields id --format csv --noquotes);
        test -n "$$CLIENT_UUID";
        /opt/keycloak/bin/kcadm.sh update realms/paktay -s "accessTokenLifespan=$$KEYCLOAK_ACCESS_TOKEN_LIFESPAN" -s "ssoSessionIdleTimeout=$$KEYCLOAK_SSO_SESSION_IDLE_TIMEOUT" -s "ssoSessionMaxLifespan=$$KEYCLOAK_SSO_SESSION_MAX_LIFESPAN";
        /opt/keycloak/bin/kcadm.sh update "clients/$$CLIENT_UUID" -r paktay -s "secret=$$KEYCLOAK_SERVICE_CLIENT_SECRET";
        /opt/keycloak/bin/kcadm.sh set-password -r paktay --username "$$PAKTAY_ADMIN_EMAIL" --new-password "$$PAKTAY_ADMIN_PASSWORD";
        /opt/keycloak/bin/kcadm.sh add-roles -r paktay --uusername service-account-paktay-auth-service --cclientid realm-management --rolename manage-users --rolename view-users --rolename query-users --rolename view-realm;
        /opt/keycloak/bin/kcadm.sh update realms/paktay -s bruteForceProtected=true -s permanentLockout=false -s failureFactor=3 -s waitIncrementSeconds=60 -s maxFailureWaitSeconds=900 -s maxDeltaTimeSeconds=43200;
        PANEL_UUID=$$(/opt/keycloak/bin/kcadm.sh get clients -r paktay -q clientId=paktay-admin-panel --fields id --format csv --noquotes);
        if [ -z "$$PANEL_UUID" ]; then /opt/keycloak/bin/kcadm.sh create clients -r paktay -s clientId=paktay-admin-panel -s "name=Paktay Admin Panel" -s enabled=true -s publicClient=false -s standardFlowEnabled=false -s directAccessGrantsEnabled=true -s implicitFlowEnabled=false -s serviceAccountsEnabled=false; PANEL_UUID=$$(/opt/keycloak/bin/kcadm.sh get clients -r paktay -q clientId=paktay-admin-panel --fields id --format csv --noquotes); fi;
        /opt/keycloak/bin/kcadm.sh update "clients/$$PANEL_UUID" -r paktay -s "secret=$$KEYCLOAK_ADMIN_PANEL_CLIENT_SECRET" -s 'attributes."access.token.lifespan"='"$$PAKTAY_ADMIN_ACCESS_TOKEN_LIFESPAN" -s 'attributes."client.session.idle.timeout"='"$$PAKTAY_ADMIN_SESSION_IDLE_TIMEOUT" -s 'attributes."client.session.max.lifespan"='"$$PAKTAY_ADMIN_SESSION_MAX_LIFESPAN";
        OLD_WEB_UUID=$$(/opt/keycloak/bin/kcadm.sh get clients -r paktay -q clientId=paktay-admin-web --fields id --format csv --noquotes);
        if [ -n "$$OLD_WEB_UUID" ]; then /opt/keycloak/bin/kcadm.sh delete "clients/$$OLD_WEB_UUID" -r paktay; fi
    environment:
      KEYCLOAK_INTERNAL_URL: ${SHARED_KEYCLOAK_INTERNAL_URL:-http://host.docker.internal:8180}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD es obligatorio}
      KEYCLOAK_SERVICE_CLIENT_SECRET: ${KEYCLOAK_SERVICE_CLIENT_SECRET:?Define KEYCLOAK_SERVICE_CLIENT_SECRET in .env}
      PAKTAY_CORS_ALLOWED_ORIGIN_PATTERNS: ${PAKTAY_CORS_ALLOWED_ORIGIN_PATTERNS:-http://localhost:*,http://127.0.0.1:*}
      KEYCLOAK_ACCESS_TOKEN_LIFESPAN: ${KEYCLOAK_ACCESS_TOKEN_LIFESPAN:-28800}
      KEYCLOAK_SSO_SESSION_IDLE_TIMEOUT: ${KEYCLOAK_SSO_SESSION_IDLE_TIMEOUT:-2592000}
      KEYCLOAK_SSO_SESSION_MAX_LIFESPAN: ${KEYCLOAK_SSO_SESSION_MAX_LIFESPAN:-2592000}
      PAKTAY_ADMIN_EMAIL: ${PAKTAY_ADMIN_EMAIL:?Define PAKTAY_ADMIN_EMAIL in .env}
      PAKTAY_ADMIN_PASSWORD: ${PAKTAY_ADMIN_PASSWORD:?Define PAKTAY_ADMIN_PASSWORD in .env}
      KEYCLOAK_ADMIN_PANEL_CLIENT_SECRET: ${KEYCLOAK_ADMIN_PANEL_CLIENT_SECRET:?Define KEYCLOAK_ADMIN_PANEL_CLIENT_SECRET in .env}
      PAKTAY_ADMIN_ACCESS_TOKEN_LIFESPAN: ${PAKTAY_ADMIN_ACCESS_TOKEN_LIFESPAN:-900}
      PAKTAY_ADMIN_SESSION_IDLE_TIMEOUT: ${PAKTAY_ADMIN_SESSION_IDLE_TIMEOUT:-1800}
      PAKTAY_ADMIN_SESSION_MAX_LIFESPAN: ${PAKTAY_ADMIN_SESSION_MAX_LIFESPAN:-28800}

  auth-svc:
    mem_limit: 640m
    mem_reservation: 160m
    restart: unless-stopped
    build:
      context: .
      dockerfile: auth-svc/Dockerfile
    environment:
      SMTP_HOST: ${SMTP_HOST:?Define SMTP_HOST in .env}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      SMTP_USER: ${SMTP_USER:?Define SMTP_USER in .env}
      SMTP_PASS: ${SMTP_PASS:?Define SMTP_PASS in .env}
      SMTP_FROM: ${SMTP_FROM:-}
      BUSINESS_DB_URL: jdbc:postgresql://business-db:5432/paktay
      BUSINESS_DB_USERNAME: paktay
      BUSINESS_DB_PASSWORD: ${BUSINESS_DB_PASSWORD:?BUSINESS_DB_PASSWORD es obligatorio}
      KEYCLOAK_INTERNAL_URL: ${SHARED_KEYCLOAK_INTERNAL_URL:-http://host.docker.internal:8180}
      KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8180}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:-http://localhost:8180/realms/paktay}
      KEYCLOAK_JWK_SET_URI: ${SHARED_KEYCLOAK_INTERNAL_URL:-http://host.docker.internal:8180}/realms/paktay/protocol/openid-connect/certs
      KEYCLOAK_SERVICE_CLIENT_SECRET: ${KEYCLOAK_SERVICE_CLIENT_SECRET:?Define KEYCLOAK_SERVICE_CLIENT_SECRET in .env}
      KEYCLOAK_ADMIN_PANEL_CLIENT_SECRET: ${KEYCLOAK_ADMIN_PANEL_CLIENT_SECRET:?Define KEYCLOAK_ADMIN_PANEL_CLIENT_SECRET in .env}
      PAKTAY_CORS_ALLOWED_ORIGIN_PATTERNS: ${PAKTAY_CORS_ALLOWED_ORIGIN_PATTERNS:-http://localhost:*,http://127.0.0.1:*}
      PAKTAY_ADMIN_REQUIRE_CLIENT_HEADER: ${PAKTAY_ADMIN_REQUIRE_CLIENT_HEADER:-true}
      PAKTAY_ADMIN_REQUIRE_PANEL_TOKEN: ${PAKTAY_ADMIN_REQUIRE_PANEL_TOKEN:-true}
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${AUTH_PORT:-8081}:8081"
    depends_on:
      business-db:
        condition: service_healthy

  business-svc:
    mem_limit: 768m
    mem_reservation: 192m
    restart: unless-stopped
    build:
      context: .
      dockerfile: business-svc/Dockerfile
    environment:
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:-http://localhost:8180/realms/paktay}
      KEYCLOAK_JWK_SET_URI: ${SHARED_KEYCLOAK_INTERNAL_URL:-http://host.docker.internal:8180}/realms/paktay/protocol/openid-connect/certs
      KEYCLOAK_HEALTH_URL: ${SHARED_KEYCLOAK_INTERNAL_URL:-http://host.docker.internal:8180}/realms/paktay
      BUSINESS_DB_URL: jdbc:postgresql://business-db:5432/paktay
      BUSINESS_DB_USERNAME: paktay
      BUSINESS_DB_PASSWORD: ${BUSINESS_DB_PASSWORD:?BUSINESS_DB_PASSWORD es obligatorio}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-}
      SUPABASE_AVATAR_BUCKET: ${SUPABASE_AVATAR_BUCKET:-avatars}
      PAKTAY_CORS_ALLOWED_ORIGIN_PATTERNS: ${PAKTAY_CORS_ALLOWED_ORIGIN_PATTERNS:-http://localhost:*,http://127.0.0.1:*}
      # Web del formulario público de soporte (vacío = los mismos dominios del panel).
      PAKTAY_CORS_PUBLIC_ORIGIN_PATTERNS: ${PAKTAY_CORS_PUBLIC_ORIGIN_PATTERNS:-}
      PAKTAY_ADMIN_REQUIRE_CLIENT_HEADER: ${PAKTAY_ADMIN_REQUIRE_CLIENT_HEADER:-true}
      PAKTAY_ADMIN_REQUIRE_PANEL_TOKEN: ${PAKTAY_ADMIN_REQUIRE_PANEL_TOKEN:-true}
      # Correo de soporte (confirmación y respuestas): el mismo SMTP que auth-svc.
      SMTP_HOST: ${SMTP_HOST:?Define SMTP_HOST in .env}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      SMTP_USER: ${SMTP_USER:?Define SMTP_USER in .env}
      SMTP_PASS: ${SMTP_PASS:?Define SMTP_PASS in .env}
      SMTP_FROM: ${SMTP_FROM:-}
      SUPPORT_VERIFY_LINK: ${SUPPORT_VERIFY_LINK:-http://localhost:8082/api/v1/public/support/verify?token={token}}
      AUTH_HEALTH_URL: http://auth-svc:8081/actuator/health
      # Avisos push opcionales. Sin credenciales, no se envía nada.
      FIREBASE_CREDENTIALS_FILE: /run/secrets/firebase-admin.json
    volumes:
      # FIREBASE_CREDENTIALS_HOST_FILE = ruta en la máquina al .json de la cuenta de
      # servicio. Sin definir se monta /dev/null (archivo vacío = avisos apagados).
      - ${FIREBASE_CREDENTIALS_HOST_FILE:-/dev/null}:/run/secrets/firebase-admin.json:ro
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${BUSINESS_PORT:-8082}:8082"
    depends_on:
      business-db:
        condition: service_healthy

  web-admin:
    mem_limit: 512m
    mem_reservation: 128m
    restart: unless-stopped
    build:
      context: ../packtay_web_admin
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_USE_MOCKS: ${WEB_NEXT_PUBLIC_USE_MOCKS:-false}
        NEXT_PUBLIC_MOCK_AUTO_LOGIN: ${WEB_NEXT_PUBLIC_MOCK_AUTO_LOGIN:-false}
    env_file:
      - ${WEB_ENV_FILE:-../packtay_web_admin/.env.local}
    environment:
      NODE_ENV: ${WEB_NODE_ENV:-production}
      # Dentro del proyecto Compose se usan los nombres de servicio, no localhost.
      AUTH_API_URL: ${WEB_AUTH_API_URL:-http://auth-svc:8081}
      BUSINESS_API_URL: ${WEB_BUSINESS_API_URL:-http://business-svc:8082}
      ADMIN_CLIENT_HEADER: ${WEB_ADMIN_CLIENT_HEADER:-admin-web}
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-3000}:3000"
    depends_on:
      auth-svc:
        condition: service_started
      business-svc:
        condition: service_started

  cloudflared:
    image: cloudflare/cloudflared:latest
    mem_limit: 128m
    mem_reservation: 64m
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}
    restart: unless-stopped
    depends_on:
      auth-svc:
        condition: service_started
      business-svc:
        condition: service_started
      web-admin:
        condition: service_started

volumes:
  business-data:
    name: ${BUSINESS_DATA_VOLUME:-${COMPOSE_PROJECT_NAME:-packtay_backend}_business-data}
